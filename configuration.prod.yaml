# Prod environment overrides for the APIOps publisher.
# The publisher applies these overrides on top of the artifacts in /apimartifacts
# when API_MANAGEMENT_ENVIRONMENT == prod. Match resources by "name" and override
# only the "properties" that differ per environment.
apimServiceName: apim-apiops-prod-poc

# Named values can be overridden per environment. Tokens like {{name}} resolve
# inside policies (not in a backend url).
namedValues:
  - name: petstore-backend-url
    properties:
      value: https://petstore3.swagger.io/api/v3

# Backend URLs must be literal absolute URLs — APIM does NOT resolve
# {{named-value}} tokens in a backend's url field.
backends:
  - name: petstore-backend
    properties:
      url: https://petstore3.swagger.io/api/v3

apis:
  - name: swagger-petstore
    properties:
      serviceUrl: https://petstore3.swagger.io/api/v3
